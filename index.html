<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bengals Team Quiz</title>
    <style>
        :root { --orange: #FB4F14; --black: #000000; --white: #ffffff; }
        body { font-family: sans-serif; background-color: var(--black); color: var(--white); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        #app { background: var(--white); color: var(--black); width: 90%; max-width: 500px; padding: 30px; border-radius: 15px; border-top: 10px solid var(--orange); text-align: center; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 2px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        button { background: var(--black); color: white; border: none; padding: 15px 25px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; }
        button:hover { background: var(--orange); }
        .option-btn { background: #f4f4f4; border: 1px solid #ddd; text-align: left; margin-bottom: 8px; }
        .correct { background: #2ecc71 !important; color: white; }
        .wrong { background: #e74c3c !important; color: white; }
        #rationale { background: #fff3e0; padding: 15px; border-left: 5px solid var(--orange); margin: 15px 0; display: none; text-align: left; }
    </style>
</head>
<body>

<div id="app">
    <!-- Screen 1: Registration -->
    <div id="registration-screen">
        <h1 style="color:var(--orange)">BENGALS QUIZ</h1>
        <p>Enter your name to begin:</p>
        <input type="text" id="participant-name" placeholder="First & Last Name">
        <button onclick="startQuiz()">START SESSION</button>
    </div>

    <!-- Screen 2: Quiz -->
    <div id="quiz-screen" style="display:none">
        <div id="progress" style="font-size: 0.8rem; color: #666;"></div>
        <h2 id="question-text"></h2>
        <div id="options-container"></div>
        <div id="rationale">
            <strong>Rationale:</strong> <span id="rationale-text"></span>
        </div>
        <button id="next-btn" style="display:none" onclick="nextQuestion()">NEXT QUESTION</button>
    </div>

    <!-- Screen 3: Results -->
    <div id="results-screen" style="display:none">
        <h1 style="color:var(--orange)">CONGRATS!</h1>
        <p id="final-score-text"></p>
        <p>Your results have been recorded for the Bengals Leaderboard.</p>
        <button onclick="location.reload()">RETAKE QUIZ</button>
    </div>
</div>

<script>
    const quizData = [
        { q: "As of April 28th, what percentage of customers have Agentic AI?", o: ["50%", "75%", "100%", "25%"], c: 2, r: "As of Tuesday, April 28, Agentic AI is available for 100% of customers." },
        { q: "Which brand is getting the Apple Pay update?", o: ["Web.com", "NetSol", "Register.com", "All"], c: 1, r: "The addition of Apple Pay is specifically for the NetSol brand." },
        { q: "What is the new standard Domain Redemption fee (post 4/15)?", o: ["$299", "$199", "$99", "$35.99"], c: 2, r: "Starting 4/15, the price is changing to $99 to meet industry standards." },
        { q: "What is the SSL promo code for April?", o: ["SSL30", "SSL0FF30", "SAVE30", "APRILSSL"], c: 1, r: "The code is SSL0FF30 (with a zero)." },
        { q: "Can agents see Apple Pay in the customer account?", o: ["Yes", "No", "Only for renewals", "Only for new buys"], c: 1, r: "Agents will not be able to see Apple Pay; this is customer-facing only." }
    ];

    let currentIdx = 0;
    let score = 0;
    let userName = "";

    function startQuiz() {
        userName = document.getElementById('participant-name').value;
        if (!userName) return alert("Please enter your name!");
        document.getElementById('registration-screen').style.display = 'none';
        document.getElementById('quiz-screen').style.display = 'block';
        loadQuestion();
    }

    function loadQuestion() {
        const data = quizData[currentIdx];
        document.getElementById('progress').innerText = `PARTICIPANT: ${userName} | Question ${currentIdx + 1}/${quizData.length}`;
        document.getElementById('question-text').innerText = data.q;
        document.getElementById('rationale').style.display = 'none';
        document.getElementById('next-btn').style.display = 'none';
        
        const container = document.getElementById('options-container');
        container.innerHTML = '';
        data.o.forEach((opt, i) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt;
            btn.onclick = () => selectOption(i);
            container.appendChild(btn);
        });
    }

    function selectOption(idx) {
        const data = quizData[currentIdx];
        const buttons = document.querySelectorAll('.option-btn');
        buttons.forEach(b => b.disabled = true);

        if (idx === data.c) {
            buttons[idx].classList.add('correct');
            score += 100;
        } else {
            buttons[idx].classList.add('wrong');
            buttons[data.c].classList.add('correct');
        }

        document.getElementById('rationale-text').innerText = data.r;
        document.getElementById('rationale').style.display = 'block';
        document.getElementById('next-btn').style.display = 'block';
    }

    function nextQuestion() {
        currentIdx++;
        if (currentIdx < quizData.length) {
            loadQuestion();
        } else {
            showResults();
        }
    }

    function showResults() {
        document.getElementById('quiz-screen').style.display = 'none';
        document.getElementById('results-screen').style.display = 'block';
        document.getElementById('final-score-text').innerText = `${userName}, you earned ${score} points!`;
        
        // This is where the "Secret" recording happens
        console.log(`Saving Result: Name: ${userName}, Score: ${score}`);
        // To actually save this to a Google Sheet, you would use a "Google Form Action URL" here.
    }
</script>
</body>
</html>
