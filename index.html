<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bengals Command Hub</title>
    <style>
        :root { --orange: #FB4F14; --black: #000000; --white: #ffffff; --gray: #f4f4f4; }
        body { font-family: 'Arial Black', sans-serif; background: var(--black); color: var(--white); margin: 0; display: flex; justify-content: center; min-height: 100vh; }
        #app { background: var(--white); color: var(--black); width: 98%; max-width: 900px; margin-top: 20px; border-radius: 20px; border: 4px solid var(--orange); overflow: hidden; display: flex; flex-direction: column; margin-bottom: 40px; }
        .tab-bar { display: flex; background: #111; border-bottom: 4px solid var(--orange); }
        .tab { flex: 1; padding: 15px; text-align: center; color: white; cursor: pointer; font-size: 0.7rem; border-right: 1px solid #333; }
        .tab.active { background: var(--orange); }
        .content { padding: 20px; text-align: center; }
        .host-grid { display: grid; grid-template-columns: 1.5fr 1fr; gap: 20px; margin-top: 20px; }
        .feed-container { background: #000; color: #00ff00; padding: 15px; border-radius: 10px; font-family: monospace; font-size: 0.75rem; height: 400px; overflow-y: auto; text-align: left; }
        .rank-container { background: var(--gray); padding: 15px; border-radius: 10px; height: 400px; overflow-y: auto; }
        .choice-btn { display: block; width: 100%; padding: 16px; margin: 10px 0; background: var(--gray); border: 2px solid #ccc; border-radius: 10px; font-weight: bold; cursor: pointer; text-align: left; }
        .correct { background: #27ae60 !important; color: white !important; }
        .wrong { background: #e74c3c !important; color: white !important; }
        .rationale { background: #fff3e0; padding: 15px; border-left: 5px solid var(--orange); text-align: left; display: none; margin: 10px 0; font-family: sans-serif; }
        button.action-btn { background: var(--orange); color: white; width: 100%; padding: 18px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 1rem; margin-top: 10px; }
        input { width: 80%; padding: 15px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #ccc; }
        .reset-btn { background: #666; color: white; border: none; padding: 10px; border-radius: 5px; cursor: pointer; font-size: 0.7rem; margin-top: 10px; }
    </style>
</head>
<body>
<div id="app">
    <div class="tab-bar" id="tab-bar" style="display:none">
        <div class="tab active" id="t-domains" onclick="switchTab('domains')">DOMAIN PROCESS</div>
        <div class="tab" id="t-voc" onclick="switchTab('voc')">VOC & INFO</div>
        <div class="tab" id="t-auth" onclick="switchTab('auth')">AUTHENTICATION</div>
    </div>
    <div class="content">
        <div id="screen-entry">
            <h1 style="color:var(--orange)">BENGALS ARENA</h1>
            <input type="text" id="username" placeholder="Full Name">
            <button class="action-btn" onclick="startQuiz()">START SESSION</button>
            <p style="margin-top:40px; font-size:0.7rem; color:#888; cursor:pointer" onclick="showHostLogin()">[ Host Access ]</p>
        </div>
        <div id="screen-host-dash" style="display:none">
            <h2 style="color:var(--orange)">HOST COMMAND CENTER</h2>
            <div class="host-grid">
                <div>
                    <h4 style="margin:5px">Live Feed (Detected by Tab)</h4>
                    <div id="host-feed" class="feed-container"></div>
                </div>
                <div>
                    <h4 style="margin:5px">Rankings</h4>
                    <div id="host-ranks" class="rank-container"></div>
                </div>
            </div>
            <button class="reset-btn" onclick="resetDatabase()">WIPE ALL DAILY DATA</button>
            <button onclick="location.reload()" style="margin-left:10px">Logout</button>
        </div>
        <div id="screen-quiz" style="display:none">
            <h2 id="q-text"></h2>
            <div id="choices-box"></div>
            <div id="rationale-box" class="rationale"><strong>WHY?</strong> <span id="r-text"></span></div>
            <button id="next-btn" class="action-btn" onclick="showLeaderboard()">CHECK STANDINGS</button>
        </div>
        <div id="screen-rank" style="display:none">
            <h2 style="color:var(--orange)">LEADERBOARD</h2>
            <div id="lb-list" style="background:#111; color:white; padding:15px; border-radius:10px; text-align:left;"></div>
            <button class="action-btn" style="background:black" onclick="nextQuestion()">NEXT QUESTION</button>
        </div>
    </div>
</div>

<script>
    const DATABASE_URL = "https://script.google.com/macros/s/AKfycbxWp_DUQbQLigctU3cXXl-ylznr5sVVv7sTYvY8S4Y3TjV3KVvx9GjjGCStCTMdLVaTJg/exec"; 
    const HOST_KEY = "BengalsHost";
    const allData = { 
        domains: [{ q: "Common reason for expiration?", o: ["Server failure", "Non-renewal", "Hacking"], c: 1, r: "Non-renewal is #1." }],
        voc: [{ q: "Agentic AI Launch %?", o: ["50%", "100%"], c: 1, r: "100% as of April 28." }],
        auth: [{ q: "PIN Attempts allowed?", o: ["1", "3", "5"], c: 1, r: "3 attempts allowed." }]
    };

    let curTab = 'domains'; let curIdx = 0; let score = 0; let uName = "";

    function showHostLogin() { 
        let p = prompt("Enter Host Password:");
        if(p === HOST_KEY) {
            document.getElementById('screen-entry').style.display='none';
            document.getElementById('screen-host-dash').style.display='block';
            setInterval(syncHost, 3000);
        }
    }

    function syncHost() {
        fetch(DATABASE_URL).then(r => r.json()).then(data => {
            let rH = ""; let fH = "";
            data.forEach((p, i) => {
                rH += `<div style="font-size:0.8rem; border-bottom:1px solid #ccc; padding:5px;">${i+1}. ${p.name} - <b>${p.score}</b></div>`;
                fH = `<div style="margin-bottom:5px"><b>${p.name}</b> [${p.topic.toUpperCase()}]: ${p.lastAction}</div>` + fH;
            });
            document.getElementById('host-ranks').innerHTML = rH;
            document.getElementById('host-feed').innerHTML = fH;
        });
    }

    function resetDatabase() {
        if(confirm("Wipe all participant data for today?")) {
            fetch(DATABASE_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ command: "RESET_ALL" }) });
            alert("Data cleared from Google Sheet.");
        }
    }

    function startQuiz() {
        uName = document.getElementById('username').value.trim();
        if(!uName) return alert("Enter Name");
        document.getElementById('screen-entry').style.display='none';
        document.getElementById('tab-bar').style.display='flex';
        document.getElementById('screen-quiz').style.display='block';
        loadQ();
    }

    function loadQ() {
        const d = allData[curTab][curIdx];
        document.getElementById('q-text').innerText = d.q;
        document.getElementById('rationale-box').style.display='none';
        document.getElementById('next-btn').style.display='none';
        const b = document.getElementById('choices-box'); b.innerHTML = '';
        d.o.forEach((opt, i) => {
            const btn = document.createElement('button'); btn.className = 'choice-btn'; btn.innerText = opt;
            btn.onclick = () => {
                const isC = (i === d.c);
                const btns = document.querySelectorAll('.choice-btn'); btns.forEach(x => x.disabled=true);
                if(isC) { btn.classList.add('correct'); score += 100; }
                else { btn.classList.add('wrong'); btns[d.c].classList.add('correct'); }
                document.getElementById('r-text').innerText = d.r;
                document.getElementById('rationale-box').style.display='block';
                document.getElementById('next-btn').style.display='block';
                // SEND DATA: includes TOPIC (the Tab name)
                fetch(DATABASE_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ name: uName, score: score, qText: d.q, isCorrect: isC, topic: curTab }) });
            };
            b.appendChild(btn);
        });
    }

    function switchTab(t) { 
        curTab = t; curIdx = 0; score = 0; 
        document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
        document.getElementById('t-'+t).classList.add('active');
        loadQ(); 
    }

    function showLeaderboard() {
        document.getElementById('screen-quiz').style.display='none';
        document.getElementById('screen-rank').style.display='block';
        fetch(DATABASE_URL).then(r => r.json()).then(data => {
            let h = ""; data.slice(0,5).forEach((p, i) => { h += `<div style="display:flex; justify-content:space-between; padding:5px; ${p.name === uName ? 'color:orange':''}"><span>${i+1}. ${p.name}</span><span>${p.score}</span></div>`; });
            document.getElementById('lb-list').innerHTML = h;
        });
    }

    function nextQuestion() {
        curIdx++; if(curIdx < allData[curTab].length) { 
            document.getElementById('screen-rank').style.display='none'; 
            document.getElementById('screen-quiz').style.display='block'; 
            loadQ(); 
        } else { alert("Tab finished!"); }
    }
</script>
</body>
</html>
